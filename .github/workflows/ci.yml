name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pineado a propósito: `ruff format` no es estable entre versiones. Desde
      # 0.16 empieza a formatear los bloques de Python dentro de los .md, así
      # que en 2026-10 un `pip install ruff` sin tocar nada pasó a marcar
      # README.md y CONTRIBUTING.md — dos ficheros que nunca se formatearon y
      # que este chequeo no miraba. El chequeo tiene que oprimirse contra la
      # versión con la que el repositorio está formateado, no contra la última
      # que exista el día del push. Para subirla: reformatear y revisar el diff
      # de los .md de paso.
      - run: pip install ruff==0.15.16
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run tests
        run: pytest --cov=geohazards --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
